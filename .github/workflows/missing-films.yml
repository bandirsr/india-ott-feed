# Weekly check: which recent Indian theatrical films have no platform in the
# live feed. Read-only against the feed; writes reports/missing-films.md and
# the job summary (open the run in the Actions tab for the readable table).
name: Missing films report

on:
  schedule:
    - cron: '17 3 * * 1' # Monday 03:17 UTC, after the 02:30 sweep has published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: missing-films
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the report
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node missing-films.mjs
      - name: Commit the report
        run: |
          git config user.name "ott-bot"
          git config user.email "ott-bot@users.noreply.github.com"
          git add reports/missing-films.md reports/missing-films.json
          git diff --staged --quiet || git commit -m "Missing films report: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
