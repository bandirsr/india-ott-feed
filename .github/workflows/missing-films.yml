# Several times a day: which recent Indian theatrical films have no platform in the
# live feed. Read-only against the feed; writes reports/missing-films.md and
# the job summary, plus reports/user-reports.md (what people sent through the
# app's "Report a missing title" form) (open the run in the Actions tab for the readable table).
name: Missing films report

on:
  schedule:
    - cron: '17 3,9,15,21 * * *' # four times a day, so a new report is never more than ~6 h old
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: missing-films
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the report
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node missing-films.mjs
      - name: Pull user reports from the app
        env:
          PUSH_ADMIN_KEY: ${{ secrets.PUSH_ADMIN_KEY }}
        run: node user-reports.mjs
      - name: Vet the user reports against TMDB, Wikipedia and the safety rules
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node vet-reports.mjs
      - name: Commit the report
        run: |
          git config user.name "ott-bot"
          git config user.email "ott-bot@users.noreply.github.com"
          git add reports/missing-films.md reports/missing-films.json reports/user-reports.md reports/user-reports.json reports/user-reports-vetted.md reports/user-reports-vetted.json
          git diff --staged --quiet || git commit -m "Missing films report: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
