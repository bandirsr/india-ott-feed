# Finds trailers in the viewer's own language by reading label channels' upload lists (1 quota unit
# per 50 videos) instead of searching (capped at 100 a day). Runs just after YouTube's quota resets
# (08:00 UTC) and spends up to 7,000 of the day's 10,000 units, leaving 3,000 for the sweeps.
name: YouTube channel scan

on:
  schedule:
    - cron: '40 8 * * *'
  workflow_dispatch:
    inputs:
      units:
        description: 'Quota units to spend (1 per playlist page)'
        default: '7000'

permissions:
  contents: write

concurrency:
  group: daily-sweep
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan label channels for dubbed-title trailers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node youtube-channel-scan.mjs ${{ github.event.inputs.units || '7000' }} | tee scan.log
      - name: Commit the cache
        run: |
          git config user.name "ott-bot"
          git config user.email "ott-bot@users.noreply.github.com"
          git add data/youtube-trailers-lang.json data/youtube-channel-scan.json
          git diff --staged --quiet || git commit -m "YouTube channel scan: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
