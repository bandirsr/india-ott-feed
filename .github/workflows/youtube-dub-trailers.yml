# Searches YouTube for trailers in the viewer's own language for dubbed titles
# (a Tamil film listed under Telugu should open the Telugu trailer). Runs once a
# day just after YouTube's quota resets (midnight Pacific = 08:00 UTC). A search
# costs 100 units of the shared 10,000/day, so 50 = 5,000 units (the very first run, with no cache yet, does 60); the rest is for
# youtube-trailers.yml (25 searches), the platform-channel pass and the sweeps.
# Run by hand with a bigger budget to use more of a day's quota.
name: YouTube dubbed trailers

on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      searches:
        description: 'Searches to run (100 quota units each)'
        default: '68'

permissions:
  contents: write

concurrency:
  group: daily-sweep
  cancel-in-progress: false

jobs:
  dubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find dubbed-title trailers on YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node youtube-dub-trailers.mjs ${{ github.event.inputs.searches || (hashFiles('data/youtube-trailers-lang.json') == '' && '68' || '68') }}
      - name: Commit the cache
        run: |
          git config user.name "ott-bot"
          git config user.email "ott-bot@users.noreply.github.com"
          git add data/youtube-trailers-lang.json
          git diff --staged --quiet || git commit -m "YouTube dubbed trailers: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
