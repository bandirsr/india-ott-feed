name: YouTube quota probe
on:
  workflow_dispatch:
    inputs:
      kind: { description: 'search|playlistItems|videos|channels', default: 'search' }
      n: { description: 'how many calls', default: '2' }
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node yt-probe.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KIND: ${{ github.event.inputs.kind }}
          N: ${{ github.event.inputs.n }}
